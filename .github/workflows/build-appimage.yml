name: Build AppImage

on:
  workflow_dispatch:
    inputs:
      use_fork:
        description: 'Use fork instead of official repo'
        required: false
        type: boolean
        default: false
      source_ref:
        description: 'Optional linphone-desktop branch or tag to build (e.g. main or refs/tags/v1.2). Leave empty to use the default remote branch.'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Optional human-readable release title/label (no effect on release tag).'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      #QT6_BASE_IMAGE: ${{ secrets.QT6_BASE_IMAGE_REF || 'ghcr.io/c0xc/qt6-fedora:6.10.1' }}
      CTR: docker
      USE_FORK: ${{ inputs.use_fork }}
      LINPHONE_REF: ${{ github.event.inputs.source_ref || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (am supposed to make my base image private)
        uses: docker/login-action@v3
        if: ${{ vars.USE_GHCR_LOGIN == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      # Cache Docker layers for the base image (alternative to pre-pull)
      # - name: Cache Docker layers
      #   uses: actions/cache@v4
      #   with:
      #     path: /tmp/.docker-cache
      #     key: docker-{{ runner.os }}-{{ hashFiles('docker/Dockerfile.fedora-qt6') }}
      #     restore-keys: |
      #       docker-{{ runner.os }}-

      - name: Pre-cache Qt6 base image
        run: |
          # Pull base image early to avoid rate limits during the main build
          # Use set +e so we don't fail if the pull is rate-limited (script will retry)
          set +e
          echo "Pulling base image ${{ env.QT6_BASE_IMAGE }}..."
          if ! docker pull "${{ env.QT6_BASE_IMAGE }}" >/dev/null 2>&1; then
            echo "Base image pull may be rate limited; script will retry"
          fi

      - name: Build Linphone AppImage
        run: CI_MODE=true ./start-build-container.sh

      - name: Inspect build-output
        run: |
          echo 'Listing build-output directory'
          ls -al build-output || true
          echo 'Listing any AppImage files'
          ls -al build-output/*.AppImage || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linphone-AppImage
          path: build-output/*.AppImage

      - name: Prepare release metadata
        id: prep_release
        env:
          GITHUB_SHA: ${{ github.sha }}
          REF_IN: ${{ github.event.inputs.source_ref || github.ref }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name || '' }}
        run: |
          set -e
          SHORT_SHA=${GITHUB_SHA::7}
          REF="$REF_IN"

          # normalize input/ref
          if echo "$REF" | grep -q '^refs/'; then
            NORMAL_REF="$REF"
          else
            NORMAL_REF="$REF"
          fi

          if echo "$NORMAL_REF" | grep -q '^refs/tags/'; then
            RELEASE_TAG="${NORMAL_REF#refs/tags/}"
            RELEASE_NAME="${INPUT_RELEASE_NAME:-Manual AppImage build for tag ${RELEASE_TAG}}"
          else
            if echo "$NORMAL_REF" | grep -q '^refs/heads/'; then
              BRANCH="${NORMAL_REF#refs/heads/}"
            else
              BRANCH="$NORMAL_REF"
            fi
            RELEASE_TAG="manual-${BRANCH}-${SHORT_SHA}-$(date -u +%Y%m%d)"
            RELEASE_NAME="${INPUT_RELEASE_NAME:-Manual AppImage build for ${BRANCH} (${SHORT_SHA})}"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release and upload AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep_release.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.prep_release.outputs.release_name }}
        run: |
          set -e
          APPIMAGE=$(ls build-output/*.AppImage 2>/dev/null | head -n1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found — skipping release upload"
            exit 0
          fi

          # create or update release using gh CLI (clobber existing asset)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading (will overwrite existing asset if present)"
            gh release upload "$TAG" "$APPIMAGE" --clobber
          else
            echo "Creating release $TAG and uploading asset"
            gh release create "$TAG" "$APPIMAGE" -t "$RELEASE_NAME" -n "AppImage build"
          fi

      # Optional: upload the AppDir tarball artifact for debugging
      # - name: Upload AppDir tarball artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: Linphone-AppDir
      #     path: build-output/Linphone-AppDir.tar.gz
